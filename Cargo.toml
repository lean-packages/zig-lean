[package]
name = "zig-lean"
version = "0.1.0"
edition = "2024"
description = "Validate and optimize Zig package build.zig.zon manifests"
license = "MIT"
repository = "https://github.com/lean-packages/zig-lean"
readme = "README.md"
keywords = ["zig", "lint", "cli", "package", "zon"]
categories = ["command-line-utilities"]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "CONTRIBUTING.md",
    "Justfile",
    "CHANGELOG.md",
    "RELEASE.md",
    "release.toml",
    "rust-toolchain.toml",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2.7.0"
tempfile = "3.20"

[dev-dependencies]
assert_cmd = "2.2.2"
cargo-release = "1.1.6"
predicates = "3.1.4"
